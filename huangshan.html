<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Région de Huangshan</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">

    <style>
        #map {
            height: calc(100vh - 120px) !important; /* Même hauteur pour intégrer le titre harmonieusement */
            width: 100% !important;
            display: block !important;
            position: relative;
        }
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

<header>
    <h1>Région de Huangshan</h1>
    <a class="homebtn" href="voyage.html">← Retour au voyage</a>
</header>

<div id="map"></div>

<!-- Scripts de base Leaflet ET du plugin Leaflet-GPX pour lire votre fichier -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.1.2/gpx.min.js"></script>

<script>
    // Configuration de la carte Leaflet
    const map = L.map('map', {
        scrollWheelZoom: true,   // CORRECTION : Zoom molette natif pour éviter le bug du zoom de page entier
        doubleClickZoom: false,  // Désactive le zoom double-clic natif pour éviter les conflits
        bounceAtZoomLimits: false // Désactive l'effet élastique au zoom
    });

    // Fond de carte OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        minZoom: 3, // Permet de dézoomer librement
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Recalcule la taille au chargement pour éviter les bugs d'affichage de Leaflet
    setTimeout(() => {
        map.invalidateSize();
    }, 150);

    // Tableau pour stocker les coordonnées et ajuster automatiquement la vue
    const points = [];

    // Fonction de création des zones (Marqueurs)
    function zone(lat, lon, name, set) {
        // Ajouter le point au tableau pour le calcul automatique des limites
        points.push([lat, lon]);

        L.marker([lat, lon], {
            icon: L.divIcon({
                className: '',
                html: `<div class="ville-box">${name}</div>`
            })
        })
        .addTo(map)
        .on('click', (e) => {
            // Empêche le clic de se propager au fond de carte
            L.DomEvent.stopPropagation(e);
            window.location = 'slideshow.html?set=' + set;
        });
    }

    // ==========================================
    // CONFIGURATION DES ZONES (MARQUEURS)
    // ==========================================

    // Hongcun
    zone(30.11, 117.99, 'Hongcun', 'hongcun');

    // Xidi
    zone(29.91, 117.99, 'Xidi', 'xidi');

    // Tunxi
    zone(29.71, 118.31, 'Tunxi', 'tunxi');

    // Mont Huangshan
    zone(30.13, 118.17, 'Mont Huangshan', 'monthuangshan');


    // ==========================================
    // CADRAGE INITIAL & PRE-CALCUL DES LIMITES
    // ==========================================
    
    // Calcule les limites englobant vos points d'intérêt fixes
    const bounds = L.latLngBounds(points);
    
    // Premier cadrage basé sur les marqueurs en attendant le chargement du GPX
    map.fitBounds(bounds.pad(0.15), {
        padding: [30, 30]
    });


    // ==========================================
    // GESTION ET AFFICHAGE DE LA TRACE GPX
    // ==========================================
    
    // Création d'un panneau spécial pour forcer la trace GPX au premier plan,
    // afin qu'elle ne soit pas cachée derrière l'étiquette "Mont Huangshan"
    map.createPane('gpxPane');
    map.getPane('gpxPane').style.zIndex = 650; // Plus haut que les marqueurs (généralement à 600)
    map.getPane('gpxPane').style.pointerEvents = 'none'; // Permet de cliquer à travers le tracé si besoin

    // Nom exact de votre fichier GPX (scrupuleusement identique à celui sur GitHub)
    const gpxUrl = 'trace.gpx'; 

    new L.GPX(gpxUrl, {
        async: true,
        marker_options: {
            startIconUrl: null, // Masque les icônes de départ par défaut du plugin
            endIconUrl: null,   // afin de ne pas surcharger vos propres marqueurs de villages
            shadowUrl: null
        },
        polyline_options: {
            color: '#e74c3c',   // Couleur de la trace (Rouge)
            opacity: 0.85,      // Opacité de la ligne
            weight: 5,          // Épaisseur pour qu'elle soit bien visible
            lineCap: 'round',
            pane: 'gpxPane'     // Associe la ligne au panneau de premier plan créé ci-dessus
        }
    }).on('loaded', function(e) {
        // Dès que le GPX est chargé, on récupère ses limites géographiques
        const gpxBounds = e.target.getBounds();
        
        // On fusionne les limites des marqueurs avec celles du tracé GPX
        bounds.extend(gpxBounds);
        
        // CORRECTION : Force le recalcul immédiat et propre du cadrage complet
        setTimeout(() => {
            map.fitBounds(bounds.pad(0.15), { padding: [30, 30] });
            map.invalidateSize();
        }, 200);
    }).addTo(map);


    // --- COMPORTEMENT DOUBLE-CLIC (RÉINITIALISATION) ---
    // Un double-clic sur le fond de carte réinitialise proprement la vue globale (marqueurs + trace)
    map.on('dblclick', function() {
        map.fitBounds(bounds.pad(0.15), { animate: true });
    });

</script>

</body>
</html>
