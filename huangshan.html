<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Région de Huangshan</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">

    <style>
        #map {
            height: calc(100vh - 120px) !important;
            width: 100% !important;
            display: block !important;
            position: relative;
        }
        body {
            margin: 0;
            padding: 0;
        }

        .custom-label-hotel {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
        }
    </style>
</head>

<body>

<header>
    <h1>Région de Huangshan</h1>
    <a class="homebtn" href="voyage.html">← Retour au voyage</a>
</header>

<div id="map"></div>

<!-- Scripts de base Leaflet ET du plugin Leaflet-GPX pour lire votre fichier -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.1.2/gpx.min.js"></script>

<script>
    // Configuration de la carte Leaflet
    const map = L.map('map', {
        scrollWheelZoom: true,
        doubleClickZoom: false,
        bounceAtZoomLimits: false
    });

    // Fond de carte OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        minZoom: 3,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Recalcule la taille au chargement pour éviter les bugs d'affichage de Leaflet
    setTimeout(() => {
        map.invalidateSize();
    }, 150);

    // Tableau pour stocker les coordonnées et ajuster automatiquement la vue
    const points = [];

    // Fonction de création des zones (Marqueurs)
    function zone(lat, lon, name, set) {

        points.push([lat, lon]);

        L.marker([lat, lon], {
            icon: L.divIcon({
                className: '',
                html: `<div class="ville-box">${name}</div>`
            })
        })
        .addTo(map)
        .on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            window.location = 'slideshow.html?set=' + set;
        });
    }

    // Fonction hôtel (icône seule)
    function hotel(lat, lon) {

        points.push([lat, lon]);

        const iconSvg = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24"
                 width="32"
                 height="32"
                 fill="#D32F2F">
                <path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/>
            </svg>
        `;

        const hotelMarker = L.marker([lat, lon], {
            icon: L.divIcon({
                className: 'custom-label-hotel',
                iconSize: [32, 32],
                iconAnchor: [16, 16],
                html: iconSvg
            })
        }).addTo(map);

        hotelMarker.setZIndexOffset(-100);
    }

    // ==========================================
    // CONFIGURATION DES ZONES (MARQUEURS)
    // ==========================================

    // Hongcun
    zone(30.11, 117.99, 'Hongcun', 'hongcun');

    // Xidi
    zone(29.91, 117.99, 'Xidi', 'xidi');

    // Tunxi
    zone(29.71, 118.31, 'Tunxi', 'tunxi');

    // Mont Huangshan
    zone(30.13, 118.17, 'Mont Huangshan - la rando', 'monthuangshan');

    // ==========================================
    // HÔTELS
    // ==========================================

    // Mild Spring Boutique Hotel
    hotel(29.708083, 118.292702);

    // Hongcun Nanhu Guanyuan Designer Lake View Resort Hotel
    hotel(30.003527, 117.986552);

    // ==========================================
    // CADRAGE INITIAL & PRE-CALCUL DES LIMITES
    // ==========================================

    const bounds = L.latLngBounds(points);

    map.fitBounds(bounds.pad(0.15), {
        padding: [30, 30]
    });

    // ==========================================
    // GESTION ET AFFICHAGE DE LA TRACE GPX
    // ==========================================

    map.createPane('gpxPane');
    map.getPane('gpxPane').style.zIndex = 650;
    map.getPane('gpxPane').style.pointerEvents = 'none';

    const gpxUrl = 'trace.gpx';

    new L.GPX(gpxUrl, {
        async: true,
        marker_options: {
            startIconUrl: null,
            endIconUrl: null,
            shadowUrl: null
        },
        polyline_options: {
            color: '#e74c3c',
            opacity: 0.85,
            weight: 5,
            lineCap: 'round',
            pane: 'gpxPane'
        }
    }).on('loaded', function(e) {

        const gpxBounds = e.target.getBounds();

        bounds.extend(gpxBounds);

        setTimeout(() => {
            map.fitBounds(bounds.pad(0.15), {
                padding: [30, 30]
            });
            map.invalidateSize();
        }, 200);

    }).addTo(map);

    // Réinitialisation par double-clic
    map.on('dblclick', function() {
        map.fitBounds(bounds.pad(0.15), {
            animate: true
        });
    });

</script>

</body>
</html>
