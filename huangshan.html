<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Région de Huangshan</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">

    <style>
        #map {
            height: calc(100vh - 120px) !important;
            width: 100% !important;
            display: block !important;
            position: relative;
        }
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

<header>
    <h1>Région de Huangshan</h1>
    <a class="homebtn" href="voyage.html">← Retour au voyage</a>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/2.1.2/gpx.min.js"></script>

<script>
    // Configuration de la carte Leaflet
    const map = L.map('map', {
        scrollWheelZoom: false,  
        doubleClickZoom: false,  
        bounceAtZoomLimits: false 
    });

    // --- COMPORTEMENT DE ZOOM FLUIDE (CTRL + MOLETTE) ---
    map.on('wheel', function(e) {
        if (e.originalEvent.ctrlKey) {
            e.originalEvent.preventDefault();
            if (e.originalEvent.deltaY < 0) {
                map.zoomIn();
            } else {
                map.zoomOut();
            }
        }
    });

    // Fond de carte OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        minZoom: 3, 
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Recalcule la taille au chargement pour éviter les bugs d'affichage
    setTimeout(() => {
        map.invalidateSize();
    }, 150);

    // Tableau pour stocker les coordonnées et ajuster automatiquement la vue
    const points = [];

    // Fonction de création des zones (Marqueurs)
    function zone(lat, lon, name, set) {
        points.push([lat, lon]);

        L.marker([lat, lon], {
            icon: L.divIcon({
                className: '',
                html: `<div class="ville-box">${name}</div>`
            })
        })
        .addTo(map)
        .on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            window.location = 'slideshow.html?set=' + set;
        });
    }

    // ==========================================
    // CONFIGURATION DES ZONES (MARQUEURS)
    // ==========================================
    zone(30.11, 117.99, 'Hongcun', 'hongcun');
    zone(29.91, 117.99, 'Xidi', 'xidi');
    zone(29.71, 118.31, 'Tunxi', 'tunxi');
    zone(30.13, 118.17, 'Mont Huangshan', 'monthuangshan');


    // ==========================================
    // CHARGEMENT DE LA TRACE GPX
    // ==========================================
    
    // Remplacez 'trace.gpx' par le nom de votre fichier GPX (qui doit être dans le même dossier)
    const gpxUrl = 'trace.gpx'; 

    new L.GPX(gpxUrl, {
        async: true,
        marker_options: {
            startIconUrl: null, // On masque les icônes de départ/arrivée par défaut du plugin
            endIconUrl: null,   // pour éviter de surcharger vos marqueurs personnalisés
            shadowUrl: null
        },
        polyline_options: {
            color: '#e74c3c', // Couleur de la trace (Rouge ici)
            opacity: 0.75,
            weight: 4,
            lineCap: 'round'
        }
    }).on('loaded', function(e) {
        // Optionnel : Si vous voulez que la carte s'ajuste à la trace ET aux marqueurs,
        // on ajoute les limites du GPX au calcul existant.
        const gpxBounds = e.target.getBounds();
        bounds.extend(gpxBounds);
        
        // On applique le cadrage final combiné
        map.fitBounds(bounds.pad(0.15), { padding: [30, 30] });
    }).addTo(map);


    // ==========================================
    // CADRAGE INITIAL DYNAMIQUE AUTOMATIQUE
    // ==========================================
    const bounds = L.latLngBounds(points);
    
    map.fitBounds(bounds.pad(0.15), {
        padding: [30, 30]
    });

    // --- COMPORTEMENT DOUBLE-CLIC (RÉINITIALISATION) ---
    map.on('dblclick', function() {
        map.fitBounds(bounds.pad(0.15), { animate: true });
    });

</script>

</body>
</html>
