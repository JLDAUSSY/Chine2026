<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Région de Pékin</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">

    <style>
        #map {
            height: calc(100vh - 120px) !important;
            width: 100% !important;
            display: block !important;
            position: relative;
        }

        body {
            margin: 0;
            padding: 0;
        }

        .custom-label-hotel {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
            cursor: pointer;
        }

        /* Style de la boîte modale pour l'affichage des images d'hôtels */
        .hotel-modal {
            display: none; /* Caché par défaut */
            position: fixed;
            z-index: 9999; /* Au-dessus de la carte Leaflet */
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
        }

        /* Conteneur de l'image */
        .hotel-modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: 85%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            border: 3px solid #fff;
            border-radius: 4px;
        }

        /* Bouton de fermeture (croix en haut à droite) */
        .hotel-modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.2s;
            user-select: none;
        }

        .hotel-modal-close:hover {
            color: #D32F2F;
        }
    </style>
</head>

<body>

<header>
    <h1>Région de Pékin</h1>
    <a class="homebtn" href="voyage.html">← Retour au voyage</a>
</header>

<div id="map"></div>

<div id="hotelModal" class="hotel-modal">
    <span class="hotel-modal-close" id="modalClose">&times;</span>
    <img class="hotel-modal-content" id="modalImg" src="" alt="Photo de l'hôtel">
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    const map = L.map('map', {
        scrollWheelZoom: true,
        doubleClickZoom: false,
        bounceAtZoomLimits: false
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        minZoom: 3,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    setTimeout(() => {
        map.invalidateSize();
    }, 150);

    const points = [];

    function zone(lat, lon, name, set, offsetX = 0, offsetY = 0) {

        points.push([lat, lon]);

        const marker = L.marker([lat, lon], {
            icon: L.divIcon({
                className: '',
                iconSize: [0, 0],
                html: `
                    <div class="ville-box" style="transform: translate(${offsetX}px, ${offsetY}px);">
                        ${name}
                    </div>
                `
            })
        })
        .addTo(map)
        .on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            window.location = 'slideshow.html?set=' + set;
        });

        marker.setZIndexOffset(1000);
    }

    // Gestionnaires d'événements pour la boîte modale
    const modal = document.getElementById('hotelModal');
    const modalImg = document.getElementById('modalImg');
    const modalClose = document.getElementById('modalClose');

    modalClose.addEventListener('click', function() {
        modal.style.display = 'none';
    });

    modal.addEventListener('click', function(e) {
        if (e.target === modal) {
            modal.style.display = 'none';
        }
    });

    // Modification de la fonction hotel pour accepter le nom de l'image
    function hotel(lat, lon, imageName) {

        points.push([lat, lon]);

        const iconSvg = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24"
                 width="32"
                 height="32"
                 fill="#D32F2F">
                <path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/>
            </svg>
        `;

        const hotelMarker = L.marker([lat, lon], {
            icon: L.divIcon({
                className: 'custom-label-hotel',
                iconSize: [32, 32],
                iconAnchor: [16, 16],
                html: iconSvg
            })
        }).addTo(map);

        hotelMarker.setZIndexOffset(-100);

        if (imageName) {
            hotelMarker.on('click', function(e) {
                L.DomEvent.stopPropagation(e); // Empêche de déclencher des clics sur la carte
                modalImg.src = 'hotels/' + imageName;
                modal.style.display = 'block';
            });
        }
    }

    // =========================
    // LIEUX TOURISTIQUES
    // =========================

    zone(39.9163, 116.3972, 'Place Tian An Men et Cité interdite', 'citeinterdite', 70, 0);

    zone(39.8822, 116.4065, 'Temple du Ciel', 'templeduciel', 0, 38);

    zone(39.9996, 116.2755, 'Palais d’Été', 'palaisdete', 0, -20);

    zone(39.9400, 116.3200, 'Pékin Ville', 'pekinville', -60, 20);

    zone(40.4319, 116.5704, 'Grande Muraille', 'mutianyu', 0, 0);

    // =========================
    // HÔTELS
    // =========================

    // Hôtel Ouest -> shichahai.jpg
    hotel(39.937442, 116.376398, 'shichahai.jpg');
    
    // Hôtel Est -> dragon.jpg
    hotel(39.931426, 116.413445, 'dragon.jpg');

    // =========================
    // CADRAGE AUTOMATIQUE
    // =========================

    const bounds = L.latLngBounds(points);

    map.fitBounds(bounds.pad(0.15), {
        padding: [30, 30]
    });

    map.on('dblclick', function () {
        map.fitBounds(bounds.pad(0.15), { animate: true });
    });

</script>

</body>
</html>
