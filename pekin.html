<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Région de Pékin</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">

    <style>
        #map {
            height: calc(100vh - 120px) !important; /* Même hauteur que voyage.html pour intégrer le titre */
            width: 100% !important;
            display: block !important;
            position: relative;
        }
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

<header>
    <h1>Région de Pékin</h1>
    <a class="homebtn" href="voyage.html">← Retour au voyage</a>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    // Configuration de la carte Leaflet
    const map = L.map('map', {
        scrollWheelZoom: false,  // Désactive le zoom molette standard (géré par CTRL plus bas)
        doubleClickZoom: false,  // Désactive le zoom double-clic natif pour éviter les conflits
        bounceAtZoomLimits: false // Désactive l'effet élastique au zoom
    });

    // --- COMPORTEMENT DE ZOOM FLUIDE (CTRL + MOLETTE) ---
    map.on('wheel', function(e) {
        if (e.originalEvent.ctrlKey) {
            // Empêche le défilement de la page entière
            e.originalEvent.preventDefault();
            
            // Détermine la direction du zoom et l'applique
            if (e.originalEvent.deltaY < 0) {
                map.zoomIn();
            } else {
                map.zoomOut();
            }
        }
    });

    // Fond de carte OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        minZoom: 3, // Permet de dézoomer librement
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Recalcule la taille au chargement pour éviter les bugs d'affichage de Leaflet
    setTimeout(() => {
        map.invalidateSize();
    }, 150);

    // Tableau pour stocker les coordonnées et ajuster automatiquement la vue
    const points = [];

    // Fonction de création des zones (Marqueurs)
    function zone(lat, lon, name, set, offsetX=0, offsetY=0) {
        // Ajouter le point au tableau pour le calcul automatique des limites
        points.push([lat, lon]);

        L.marker([lat, lon], {
            icon: L.divIcon({
                className: '',
                iconSize: [0, 0],
                html: `
                    <div class="ville-box" style="transform: translate(${offsetX}px, ${offsetY}px);">
                        ${name}
                    </div>
                `
            })
        })
        .addTo(map)
        .on('click', (e) => {
            // Empêche le clic de se propager au fond de carte
            L.DomEvent.stopPropagation(e);
            window.location = 'slideshow.html?set=' + set;
        });
    }

    // ==========================================
    // CONFIGURATION DES ZONES (MARQUEURS)
    // ==========================================

    // Cité interdite
    zone(39.9163, 116.3972, 'Place Tian An Men et Cité interdite', 'citeinterdite', 70, 0);

    // Temple du Ciel
    zone(39.8822, 116.4065, 'Temple du Ciel', 'templeduciel', 0, 38);

    // Palais d'Été
    zone(39.9996, 116.2755, 'Palais d’Été', 'palaisdete', 0, -20);

    // Pékin Centre-Ville
    zone(39.9400, 116.3200, 'Pékin Ville', 'pekinville', -60, 20);

    // Grande Muraille
    zone(40.4319, 116.5704, 'Grande Muraille', 'mutianyu', 0, 0);


    // ==========================================
    // CADRAGE INITIAL DYNAMIQUE AUTOMATIQUE
    // ==========================================
    
    // Calcule les limites parfaites englobant vos points d'intérêt à Pékin
    const bounds = L.latLngBounds(points);
    
    // Applique le cadrage au chargement (avec une marge de 0.15 pour laisser respirer la Muraille et le Temple)
    map.fitBounds(bounds.pad(0.15), {
        padding: [30, 30]
    });

    // --- COMPORTEMENT DOUBLE-CLIC (RÉINITIALISATION) ---
    // Un double-clic sur le fond de carte réinitialise proprement la vue sur la région
    map.on('dblclick', function() {
        map.fitBounds(bounds.pad(0.15), { animate: true });
    });

</script>

</body>
</html>
