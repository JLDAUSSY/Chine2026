<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Région de Xi'an</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">

    <style>
        #map {
            height: calc(100vh - 120px) !important; /* Même hauteur que voyage.html pour intégrer le titre */
            width: 100% !important;
            display: block !important;
            position: relative;
        }
        body {
            margin: 0;
            padding: 0;
        }

        /* Force l'annulation des styles par défaut des DivIcon de Leaflet pour l'hôtel */
        .custom-label-hotel {
            background: none !important;
            border: none !important;
            box-shadow: none !important;
        }

        /* Conteneur de l'icône et du texte alignés */
        .hotel-marker-wrapper {
            display: flex;
            align-items: center;
            gap: 12px; /* Espace doublé entre l'icône et le texte */
            white-space: nowrap;
        }
    </style>
</head>

<body>

<header>
    <h1>Région de Xi'an</h1>
    <a class="homebtn" href="voyage.html">← Retour au voyage</a>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    // Configuration de la carte Leaflet
    const map = L.map('map', {
        scrollWheelZoom: true,   // CORRECTION : Active le zoom molette standard sans toucher au zoom global de la page HTML
        doubleClickZoom: false,  // Désactive le zoom double-clic natif pour éviter les conflits
        bounceAtZoomLimits: false // Désactive l'effet élastique au zoom
    });

    // Fond de carte OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        minZoom: 3, // Permet de dézoomer librement
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Recalcule la taille au chargement pour éviter les bugs d'affichage de Leaflet
    setTimeout(() => {
        map.invalidateSize();
    }, 150);

    // Tableau pour stocker les coordonnées et ajuster automatiquement la vue
    const points = [];

    // Fonction de création des zones (Marqueurs standards avec étiquettes blanches au premier plan)
    function zone(lat, lon, name, set) {
        points.push([lat, lon]);

        const marker = L.marker([lat, lon], {
            icon: L.divIcon({
                className: '',
                html: `<div class="ville-box">${name}</div>`
            })
        })
        .addTo(map)
        .on('click', (e) => {
            // Empêche le clic de se propager au fond de carte
            L.DomEvent.stopPropagation(e);
            window.location = 'slideshow.html?set=' + set;
        });

        // Met un zIndex très élevé pour que les étiquettes blanches restent TOUJOURS au-dessus
        marker.setZIndexOffset(1000);
    }

    // Fonction pour l'affichage de l'hôtel (Icône rouge + Texte rouge gras DOUBLÉS, en arrière-plan)
    function texteHotel(lat, lon, name) {
        points.push([lat, lon]);

        // TAILLE DOUBLÉE : Icône SVG en 32x32 pixels
        const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32" fill="#D32F2F" style="display: inline-block; vertical-align: middle;">
            <path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/>
        </svg>`;

        const hotelMarker = L.marker([lat, lon], {
            icon: L.divIcon({
                className: 'custom-label-hotel', 
                iconSize: [350, 40],            // Taille du bloc pour accueillir les éléments agrandis
                iconAnchor: [16, 20],           // CORRECTION : Ancrage centré sur l'icône de 32px pour éviter de fausser le calcul de fitBounds
                html: `
                    <div class="hotel-marker-wrapper">
                        ${iconSvg}
                        <span style="color: #D32F2F !important; font-family: sans-serif; font-weight: bold; font-size: 26px;">${name}</span>
                    </div>
                `
            })
        }).addTo(map);

        // Met un zIndex bas pour que ce marqueur glisse derrière les étiquettes de zone lors des dézooms
        hotelMarker.setZIndexOffset(-100);
    }

    // ==========================================
    // CONFIGURATION DES ZONES (MARQUEURS)
    // ==========================================

    // Xi'an centre
    zone(34.282, 108.95, "Xi'an ville", 'xiancentre');
    
    // Grande Mosquée
    zone(34.263, 108.939, "Grande Mosquée", 'grandemosquee');

    // Armée enterrée
    zone(34.385, 109.273, 'Armée enterrée', 'armeeenterree');

    // Petite pagode
    zone(34.225, 108.95, 'Petite pagode de l’oie sauvage', 'petitepagode');

    // Grande pagode
    zone(34.205, 108.97, 'Grande pagode de l’oie sauvage', 'grandepagode');

    // POSITION DE L'HÔTEL (Taille doublée, correctement ancrée, passe sous l'étiquette de la Grande Mosquée)
    texteHotel(34.26155, 108.94635, "City Confort Inn");


    // ==========================================
    // CADRAGE INITIAL DYNAMIQUE
    // ==========================================
    
    // Calcule les limites parfaites englobant vos marqueurs
    const bounds = L.latLngBounds(points);
    
    // Applique le cadrage idéal initial au chargement (avec petite marge de 0.08)
    map.fitBounds(bounds.pad(0.08), {
        padding: [30, 30]
    });

    // --- COMPORTEMENT DOUBLE-CLIC (RÉINITIALISATION) ---
    map.on('dblclick', function() {
        map.fitBounds(bounds.pad(0.08), { animate: true });
    });

</script>

</body>
</html>
