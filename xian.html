<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Région de Xi'an</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="style.css">

    <style>
        #map {
            height: calc(100vh - 120px) !important;
            width: 100% !important;
            display: block !important;
            position: relative;
        }
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

<header>
    <h1>Région de Xi'an</h1>
    <a class="homebtn" href="voyage.html">← Retour au voyage</a>
</header>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    const map = L.map('map', {
        scrollWheelZoom: true,
        doubleClickZoom: false,
        bounceAtZoomLimits: false
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        minZoom: 3,
        attribution: '© OpenStreetMap'
    }).addTo(map);

    setTimeout(() => {
        map.invalidateSize();
    }, 150);

    const points = [];

    function zone(lat, lon, name, set) {
        points.push([lat, lon]);

        L.marker([lat, lon], {
            icon: L.divIcon({
                className: '',
                html: `<div class="ville-box">${name}</div>`
            })
        })
        .addTo(map)
        .on('click', (e) => {
            L.DomEvent.stopPropagation(e);
            window.location = 'slideshow.html?set=' + set;
        });
    }

    // ICÔNE HÔTEL (SANS TEXTE)
    function hotel(lat, lon) {

        points.push([lat, lon]);

        const iconSvg = `
            <svg xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24"
                 width="32"
                 height="32"
                 fill="#D32F2F">
                <path d="M7 13c1.66 0 3-1.34 3-3S8.66 7 7 7s-3 1.34-3 3 1.34 3 3 3zm12-6h-8v7H3V5H1v15h2v-3h18v3h2v-9c0-2.21-1.79-4-4-4z"/>
            </svg>
        `;

        const hotelMarker = L.marker([lat, lon], {
            icon: L.divIcon({
                className: '',
                iconSize: [32, 32],
                iconAnchor: [16, 16],
                html: iconSvg
            })
        }).addTo(map);

        hotelMarker.setZIndexOffset(-100);
    }

    // =========================
    // ZONES
    // =========================

    zone(34.282, 108.95, "Xi'an ville", 'xiancentre');
    zone(34.263, 108.939, "Grande Mosquée", 'grandemosquee');
    zone(34.385, 109.273, 'Armée enterrée', 'armeeenterree');
    zone(34.225, 108.95, 'Petite pagode de l’oie sauvage', 'petitepagode');
    zone(34.205, 108.97, 'Grande pagode de l’oie sauvage', 'grandepagode');

    // =========================
    // HÔTEL AJOUTÉ
    // =========================

    hotel(34.261329, 108.946097);

    // =========================
    // CADRAGE
    // =========================

    const bounds = L.latLngBounds(points);

    map.fitBounds(bounds.pad(0.08), {
        padding: [30, 30]
    });

    map.on('dblclick', function() {
        map.fitBounds(bounds.pad(0.08), { animate: true });
    });

</script>

</body>
</html>
